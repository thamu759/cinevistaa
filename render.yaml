services:
  - type: web
    name: cinevistaa-strapi
    runtime: node
    plan: free
    rootDir: strapi
    buildCommand: npm install && npm run build
    startCommand: mkdir -p public/uploads && npm run start
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: PORT
        value: 10000
      - key: DATABASE_CLIENT
        value: postgres
      - key: DATABASE_URL
        fromDatabase:
          name: cinevistaa-strapi-db
          property: connectionString
      - key: DATABASE_SSL
        value: true
      - key: APP_KEYS
        sync: false
      - key: API_TOKEN_SALT
        sync: false
      - key: ADMIN_JWT_SECRET
        sync: false
      - key: TRANSFER_TOKEN_SALT
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: CORS_ORIGIN
        value: https://cinevistaa.netlify.app,http://localhost:5173

databases:
  - name: cinevistaa-strapi-db
    plan: free
    databaseName: cinevistaa_strapi
    user: cinevistaa_strapi_user
