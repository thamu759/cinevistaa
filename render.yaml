services:
  # ─── THIRAIPEDIA STAGING BACKEND (BRANCH: staging) ───
  - type: web
    name: cinevistaa-staging
    runtime: node
    plan: free
    rootDir: server
    buildCommand: npm install
    startCommand: node staging.js
    autoDeploy: true
    branch: staging
    envVars:
      - key: NODE_ENV
        value: staging
      - key: PORT
        value: 10000
      - key: DB_FILE
        value: db.staging.json
      - key: CORS_ORIGIN
        value: https://staging--ereaa.netlify.app,https://staging--cinevistaa.netlify.app,https://staging.cinevistaa.in,http://localhost:5174
      - key: TMDB_API_KEY
        sync: false
      - key: TMDB_ACCESS_TOKEN
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: MONGO_URI
        sync: false
