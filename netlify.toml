[build]
  base = "."
  command = "cd client && npm install --include=dev && node ./node_modules/vite/bin/vite.js build"
  publish = "client/dist"

[build.environment]
  NODE_VERSION = "22.23.4"

[[redirects]]
  from = "https://www.cinevistaa.in/*"
  to = "https://cinevistaa.in/:splat"
  status = 301
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
