[build]
  command = "cd client && npm run build && node -e \"require('fs').copyFileSync('../db.json', '../netlify/functions/db.json')\""
  functions = "netlify/functions"
  publish = "client/dist"

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
