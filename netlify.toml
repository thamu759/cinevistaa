[build]
  command = "cd client && npm install --include=dev && node ./node_modules/vite/bin/vite.js build"
  publish = "client/dist"

[context.production.environment]
  VITE_API_URL = "https://cinevistaa.onrender.com/api"

[[redirects]]
  from = "https://www.cinevistaa.in/*"
  to = "https://cinevistaa.in/:splat"
  status = 301

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
